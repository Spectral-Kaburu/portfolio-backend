[package]
name = "portfolio-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dialoguer = "0.11"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
tabled = "0.16"
jsonschema = "0.20"
reqwest = { version = "0.12", features = ["blocking"] }
indexmap = "2.7"
async-trait = "0.1"
regex = "1.11"
rand = "0.8"

[dev-dependencies]
tempfile = "3.15"